<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in · BizPartnerCheck</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body data-page="login">
    <header class="header">
      <a href="index.html" class="brand">BizPartner<span>Check</span></a>
      <nav class="nav">
        <a href="login.html" class="active" aria-current="page">Log in</a>
        <a href="register.html">Register</a>
      </nav>
    </header>

    <main class="main">
      <!-- Login form -->
      <section class="card" id="login-view">
        <h1>Log in</h1>
        <p class="muted">Enter your email and password.</p>

        <div class="alert" id="login-alert" role="alert" hidden>
          <p class="alert-title"></p>
          <p class="alert-body"></p>
        </div>

        <form id="login-form" novalidate>
          <fieldset>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.at" />
              <p class="field-error" id="email-error" hidden></p>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" />
              <p class="field-error" id="password-error" hidden></p>
            </div>
            <button type="submit" class="button button-primary button-block">Log in</button>
          </fieldset>
        </form>

        <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
      </section>

      <!-- Shown after a successful login -->
      <section class="card center" id="login-success" role="status" hidden>
        <div class="success-icon" aria-hidden="true">✓</div>
        <h1>You are logged in</h1>
        <p class="muted">The application area is not available yet.</p>
      </section>
    </main>

    <footer class="footer">© <span data-year>2026</span> BizPartnerCheck</footer>
  </body>
</html>
